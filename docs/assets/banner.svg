<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#121217" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16" />
  <rect width="1200" height="360" fill="url(#radialGlow)" rx="16" />

  <!-- Subtle Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" stroke="#27272a" stroke-width="1" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#71717a" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Center Decorative Glow -->
  <circle cx="600" cy="170" r="160" fill="#9333ea" opacity="0.18" filter="url(#purpleGlow)" />

  <!-- Header Pill / Chip -->
  <g transform="translate(470, 56)">
    <rect x="0" y="0" width="260" height="30" rx="15" fill="#27272a" fill-opacity="0.8" stroke="#3f3f46" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#a855f7" />
    <text x="30" y="20" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">TAURI V2 · WINDOWS 10 / 11</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="155" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    FFMPEG-Toolkit
  </text>

  <!-- Tagline -->
  <text x="600" y="200" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Run custom FFmpeg commands directly from the Windows Explorer context menu
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Pill 1: Explorer Menu -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="190" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="95" y="23" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Cascading Context Menu</text>
    </g>

    <!-- Pill 2: Presets -->
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="190" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="95" y="23" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Quality-First Presets</text>
    </g>

    <!-- Pill 3: Sequential Queue -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="190" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="95" y="23" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Sequential Job Queue</text>
    </g>

    <!-- Pill 4: Zero Admin Rights -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="170" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="85" y="23" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">HKCU · No Admin Needed</text>
    </g>
  </g>
</svg>
